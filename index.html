<!-- 2048 Game HTML with title, score area, restart button, and 4x4 game container -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>2048 Game</title>
</head>
<body>
  <header id="page-header">
    <h1>2048</h1>
    <div id="game-actions">
      <button id="undo-button" type="button" aria-label="Undo last move" title="Undo last move" disabled>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h9a7 7 0 0 1 0 14h-2"/></svg>
        <span class="button-label">Undo</span>
      </button>
      <button id="restart-button" type="button" aria-label="Restart game">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 7v5h-5M20 12a8 8 0 1 1-2.34-5.66L20 9"/></svg>
        <span class="button-label">Restart</span>
      </button>
    </div>
    <div id="theme-control">
      <label for="theme-select">Theme</label>
      <select id="theme-select">
        <option value="classic">Classic</option>
        <option value="dark">Dark</option>
        <option value="ocean">Ocean</option>
        <option value="pastel">Pastel</option>
        <option value="lavender">Lavender</option>
        <option value="candy">Candy</option>
        <option value="forest">Forest</option>
        <option value="sunset">Sunset</option>
        <option value="midnight-gold">Midnight Gold</option>
      </select>
    </div>
  </header>
  <div id="board-wrapper">
    <div id="game-container"></div>
    <div id="game-overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-message" hidden>
      <p id="overlay-message"></p>
      <button id="overlay-action-button" type="button"></button>
    </div>
  </div>
  <dialog id="restart-dialog" aria-labelledby="restart-dialog-title" aria-describedby="restart-dialog-description">
    <form method="dialog">
      <h2 id="restart-dialog-title">Start a new game?</h2>
      <p id="restart-dialog-description">Your current game will be replaced.</p>
      <div class="dialog-actions">
        <button id="cancel-restart-button" type="submit" value="cancel" autofocus>Keep playing</button>
        <button id="confirm-restart-button" type="submit" value="restart">Restart</button>
      </div>
    </form>
  </dialog>
  <div id="score-area">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best-score">0</span></div>
  </div>
  <p id="message" aria-live="polite"></p>
  <script type="module" src="app.js"></script>
</body>
</html>
